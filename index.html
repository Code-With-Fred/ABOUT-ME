    <!--
      Search console + analytics are disabled until real IDs are added.
      The placeholders below (YOUR_GOOGLE_VERIFICATION_CODE / G-XXXXXXXXXX) were being served
      as-is, which does nothing but add a wasted script request on every page load.

      To turn these on:
      1. Google Search Console -> Settings -> Ownership verification -> HTML tag, paste the
         content value into the google-site-verification meta below.
      2. Bing Webmaster Tools -> same idea, into msvalidate.01.
      3. Google Analytics -> Admin -> Data Streams -> your stream -> Measurement ID (G-XXXXXXXXXX),
         uncomment the gtag script block and replace both G-XXXXXXXXXX occurrences.

      <meta name="google-site-verification" content="" />
      <meta name="msvalidate.01" content="" />
      <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX');
      </script>
    -->
